<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Foto & Lokasi Otomatis</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #video-stream {
            width: 100%;
            max-width: 560px;
            height: auto;
            border: 4px solid #3498db;
            border-radius: 6px;
            display: block;
            margin: 10px auto;
        }
        #results {
            margin-top: 30px;
            padding: 15px;
            border-top: 2px dashed #ccc;
        }
        #photo-preview {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            margin-top: 15px;
            display: none;
        }
        #canvas-output { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Pengambilan Data Otomatis</h1>
        <p>Akses kamera dan lokasi akan dimulai secara otomatis.</p>
        
        <video id="video-stream" autoplay playsinline style="display: none;"></video>
        <canvas id="canvas-output" width="640" height="480"></canvas>

        <hr>

        <div id="results">
            <h2>Status Proses</h2>
            <p id="process-status">Memulai akses...</p>
            <p><strong>Lokasi Tersimpan:</strong> <span id="saved-location-data">Menunggu...</span></p>
            
            <h3>Foto Tersimpan</h3>
            <img id="photo-preview" />
        </div>
        
    </div>

    <script>
        const video = document.getElementById('video-stream');
        const canvas = document.getElementById('canvas-output');
        const context = canvas.getContext('2d');
        const photoPreview = document.getElementById('photo-preview');
        const savedLocationData = document.getElementById('saved-location-data');
        const processStatus = document.getElementById('process-status');
        let stream = null;

        // --- 1. Fungsi Utama: Ambil Foto, Lokasi, dan Simpan ---
        async function initiateCaptureAndSave() {
            processStatus.textContent = 'Meminta izin kamera...';
            
            try {
                // A. Mulai Kamera (Otomatis)
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                video.style.display = 'block'; // Tampilkan sebentar
                
                processStatus.textContent = '✅ Izin kamera didapat. Memulai pengambilan foto dan lokasi...';
                
                // Tunggu sebentar agar video stream stabil (opsional, tapi disarankan)
                await new Promise(resolve => setTimeout(resolve, 500)); 

                // B. Ambil Foto
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const photoDataURL = canvas.toDataURL('image/png');

                // C. Matikan Kamera
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                video.style.display = 'none'; // Sembunyikan lagi

                // D. Ambil Lokasi & Simpan (Local Storage)
                getGeolocAndSave(photoDataURL);

            } catch (err) {
                processStatus.textContent = '❌ Gagal mengakses kamera. Error: ' + err.message;
                console.error("Error Kamera: " + err);
                getGeolocAndSave(null); // Coba ambil lokasi saja jika kamera gagal
            }
        }
        
        // --- 2. Fungsi Ambil Lokasi & Simpan ---
        function getGeolocAndSave(photoDataURL) {
            processStatus.textContent += ' Meminta izin lokasi...';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const timestamp = new Date().toLocaleString();
                        const locationString = `Lat: ${lat.toFixed(6)}, Lon: ${lon.toFixed(6)} (${timestamp})`;

                        // Simpan ke Local Storage
                        saveToLocalStorage(photoDataURL, locationString);
                        
                    },
                    (error) => {
                        // Jika lokasi gagal didapat
                        const locationString = 'Lokasi tidak tersedia atau ditolak.';
                        saveToLocalStorage(photoDataURL, locationString);
                    }
                );
            } else {
                // Jika Geolocation tidak didukung
                const locationString = 'Geolocation tidak didukung.';
                saveToLocalStorage(photoDataURL, locationString);
            }
        }
        
        // --- 3. Fungsi Penyimpanan ---
        function saveToLocalStorage(photoDataURL, locationString) {
            
            // Simpan Lokasi
            localStorage.setItem('capturedLocation', locationString);
            savedLocationData.textContent = locationString;
            
            // Simpan Foto (jika berhasil diambil)
            if (photoDataURL) {
                try {
                    localStorage.setItem('capturedPhoto', photoDataURL);
                    photoPreview.src = photoDataURL;
                    photoPreview.style.display = 'block';
                    processStatus.textContent = '✅ Sukses! Foto dan Lokasi disimpan ke Local Storage.';
                } catch (e) {
                    processStatus.textContent = `❌ Penyimpanan Foto gagal (Local Storage Penuh). Lokasi tersimpan. Error: ${e.message}`;
                    photoPreview.style.display = 'none';
                }
            } else {
                 processStatus.textContent = '❌ Foto gagal diambil. Lokasi (jika tersedia) disimpan.';
            }
            
            // Perbarui status akhir
            loadFromLocalStorage();
        }

        // --- 4. Fungsi Muat Data Saat Halaman Dimuat ---
        function loadFromLocalStorage() {
            const savedPhoto = localStorage.getItem('capturedPhoto');
            const savedLocation = localStorage.getItem('capturedLocation');

            if (savedPhoto) {
                photoPreview.src = savedPhoto;
                photoPreview.style.display = 'block';
            }
            if (savedLocation) {
                savedLocationData.textContent = savedLocation;
            }
        }


        // --- EKSEKUSI OTOMATIS SAAT KODE DIMUAT ---
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage(); // Tampilkan data lama
            initiateCaptureAndSave(); // Mulai proses pengambilan data baru
        });

    </script>

</body>
</html>
